name: Install and run
on: [push, pull_request]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          python -m pip install --only-binary=:all: -r requirements-lock.txt
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python verify_data.py
      - run: python run_benchmarks.py --suite smoke --workers 2
      - run: python -m eidos fit --input examples/demo.csv --target target --output results/cli
      - run: python -m eidos predict --model results/cli/model.json --input examples/demo.csv --output results/predictions.csv
